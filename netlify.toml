[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/businesses"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/businesses/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/business"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/business/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
