[build]
  # Install Chromium before Vite+prerender so scripts/prerender.mjs can write
  # the hydrated landing HTML into dist/index.html on Netlify build images.
  # If Chromium install/launch fails, prerender.mjs soft-skips (exit 0) and the
  # Vite shell remains — see docs/netlify-prerender.md.
  command = "npx playwright install chromium && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API routes MUST sit above the /* SPA fallback so /api never serves index.html.
[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-not-found"
  status = 200
  force = true

[[redirects]]
  from = "/contact"
  to = "/support"
  status = 301

[[redirects]]
  from = "/contact/*"
  to = "/support"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/terms/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/support/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/affiliate-disclosure"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/affiliate-disclosure/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/businesses"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/businesses/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/business"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/business/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
